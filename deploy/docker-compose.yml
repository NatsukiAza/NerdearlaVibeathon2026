# From repo root:
#   docker compose -f deploy/docker-compose.yml up
#
# The browser on the host calls the published API at localhost:8000.
# Do NOT set VITE_API_BASE=http://api:8000 for this SPA — that DNS name
# only resolves inside the Compose network, not in the user's browser.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # SPEECH_BACKEND: omit so env.md resolution applies (pass via .env if overriding)
      PRODUCTION_TOKEN: ${PRODUCTION_TOKEN:?Set PRODUCTION_TOKEN in .env (use dev-token only for local)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - ../fixtures:/app/fixtures:ro
      - ../glossary:/app/glossary:ro
    working_dir: /app

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Browser on the host → published API port (not Docker DNS name `api`).
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    depends_on:
      - api
